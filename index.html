<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctors Directory</title>
  <style>
    :root {
      --bg: #f3f5f9; --card: #ffffff; --text: #162033; --muted: #6b7385; --line: #e4e8ef;
      --blob1: #7aa7ff; --blob2: #f59ac0; --blob3: #6fe0c1; --blob-o: .45;
      --wa: #25d366; --wa-text: #063d1e;
      --shadow: 0 1px 2px rgba(16,24,40,.06), 0 10px 24px -14px rgba(16,24,40,.22);
      --ease: cubic-bezier(.2,.8,.2,1); --bounce: cubic-bezier(.3,1.5,.5,1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1017; --card: #171b24; --text: #e9ecf2; --muted: #9aa2b1; --line: #262c38;
        --blob-o: .18; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.7);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; min-height: 100vh; overflow-x: hidden; }
    button { font: inherit; color: inherit; }
    .ico { display: block; width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
    [hidden] { display: none !important; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes pop    { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
    @keyframes tileIn { from { opacity: 0; transform: translateY(28px) scale(.92); } to { opacity: 1; transform: none; } }
    @keyframes slideIn{ from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
    @keyframes shine  { to { transform: translateX(130%); } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes wiggle { 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
    @keyframes beat   { 0% { stroke-dashoffset: 1; } 45%, 65% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1; } }
    @keyframes letterIn { from { opacity: 0; transform: translateY(-24px) rotate(-12deg) scale(.6); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes textIn { from { opacity: 0; transform: translateX(-14px); } }
    @keyframes float  { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-6deg); } }
    @keyframes heart  { 0%, 45%, 100% { transform: scale(1); } 12% { transform: scale(1.16); } 24% { transform: scale(1); } 34% { transform: scale(1.09); } }
    @keyframes ring   { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-18deg); } 88% { transform: rotate(15deg); } 92% { transform: rotate(-9deg); } 96% { transform: rotate(5deg); } }
    @keyframes avatarIn { from { opacity: 0; transform: scale(.3) rotate(-45deg); } to { opacity: 1; transform: none; } }
    @keyframes barGrow { from { transform: scaleX(0); } }
    @keyframes shimmer { to { background-position: 200% center; } }
    @keyframes blink  { 50% { opacity: 0; } }
    @keyframes drift  {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(40px, 30px) scale(1.12); }
      100% { transform: translate(-30px, 50px) scale(.95); }
    }

    /* Soft moving colours in the background */
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .blob { position: absolute; width: 320px; height: 320px; border-radius: 50%; filter: blur(70px); opacity: var(--blob-o); animation: drift 18s ease-in-out infinite alternate; }
    .b1 { background: var(--blob1); top: -120px; left: -100px; }
    .b2 { background: var(--blob2); top: 35%; right: -150px; animation-duration: 22s; animation-delay: -6s; }
    .b3 { background: var(--blob3); bottom: -150px; left: 5%; animation-duration: 26s; animation-delay: -12s; }

    /* ---------- Home: departments ---------- */
    .hero { position: relative; text-align: center; padding: 44px 0 26px; }
    .logo {
      width: 66px; height: 66px; margin: 0 auto 14px; border-radius: 20px; display: grid; place-items: center; color: #fff;
      background: linear-gradient(135deg, #4f8df7, #c84fd8); box-shadow: 0 14px 30px -12px rgba(110,80,230,.65);
      animation: pop .6s var(--bounce) backwards;
    }
    .logo .ico { width: 36px; height: 36px; animation: heart 2.4s ease-in-out 1s infinite; }
    .logo .pulse { stroke-dasharray: 1; stroke-dashoffset: 1; animation: beat 2.4s ease-in-out .6s infinite; }
    h1 { font-size: 27px; letter-spacing: -.02em; margin: 0; }
    h1 .l { display: inline-block; animation: letterIn .6s var(--bounce) backwards; animation-delay: calc(var(--l) * 35ms + 200ms); }
    .title-bar {
      display: block; width: 64px; height: 4px; margin: 10px auto 0; border-radius: 4px;
      background: linear-gradient(90deg, #4f8df7, #c84fd8, #f7657d, #22c39d, #4f8df7); background-size: 200% auto;
      animation: barGrow .7s .85s var(--ease) backwards, shimmer 4s linear infinite;
    }
    .hero p { margin: 10px 0 0; color: var(--muted); min-height: 1.45em; }
    .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px; background: currentColor; animation: blink 1s step-end infinite; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .credit { text-align: center; padding: 22px 0 36px; font-size: 13px; color: var(--muted); animation: fadeUp .7s 1.3s var(--ease) backwards; }
    .credit b {
      font-weight: 700; background: linear-gradient(90deg, #4f8df7, #c84fd8, #f7657d, #4f8df7); background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 4s linear infinite;
    }
    .tile {
      position: relative; overflow: hidden; text-align: left; border: 0; border-radius: 24px; padding: 18px;
      min-height: 158px; cursor: pointer; color: #fff; display: flex; flex-direction: column; justify-content: space-between;
      background: linear-gradient(140deg, var(--g1), var(--g2)); box-shadow: 0 16px 30px -16px var(--g2);
      animation: tileIn .7s var(--ease) backwards; animation-delay: calc(var(--i) * 90ms + 250ms);
      transition: transform .25s var(--ease), box-shadow .25s var(--ease);
    }
    .tile:hover { transform: translateY(-4px); box-shadow: 0 22px 34px -16px var(--g2); }
    .tile:active { transform: scale(.96); }
    .tile::after {
      content: ""; position: absolute; width: 150px; height: 150px; border-radius: 50%;
      background: rgba(255,255,255,.14); right: -55px; bottom: -65px; transition: transform .5s var(--ease);
    }
    .tile:hover::after { transform: scale(1.25); }
    .tile::before {
      content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; transform: translateX(-130%);
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.38) 50%, transparent 70%);
      animation: shine 1.1s ease-out; animation-delay: calc(var(--i) * 90ms + 850ms);
    }
    .tile > * { position: relative; z-index: 1; }
    .tile-icon {
      width: 48px; height: 48px; border-radius: 15px; background: rgba(255,255,255,.22); display: grid; place-items: center;
      animation: pop .5s var(--bounce) backwards; animation-delay: calc(var(--i) * 90ms + 550ms);
    }
    .tile-icon .ico { animation: float 3.2s ease-in-out infinite; animation-delay: calc(var(--i) * -.8s); }
    .tile:hover .tile-icon .ico { animation: wiggle .6s ease; }
    .tile-name {
      display: block; font-size: 19px; font-weight: 700; letter-spacing: -.01em;
      animation: textIn .5s var(--ease) backwards; animation-delay: calc(var(--i) * 90ms + 600ms);
    }
    .tile-count {
      display: block; font-size: 13px; opacity: .92;
      animation: textIn .5s var(--ease) backwards; animation-delay: calc(var(--i) * 90ms + 720ms);
    }
    .returning .tile { animation-delay: calc(var(--i) * 45ms); }
    .returning .tile::before, .returning .logo, .returning h1 .l, .returning .credit,
    .returning .tile-name, .returning .tile-count { animation: none; }
    .returning .title-bar { animation: shimmer 4s linear infinite; }
    .returning .tile-icon { animation-delay: calc(var(--i) * 45ms + 200ms); }

    /* ---------- Department: doctors list ---------- */
    #dept { animation: slideIn .45s var(--ease) backwards; }
    .band {
      position: relative; overflow: hidden; color: #fff; padding: 18px 0 50px;
      background: linear-gradient(140deg, var(--g1), var(--g2)); border-radius: 0 0 30px 30px;
    }
    .band::after {
      content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%;
      background: rgba(255,255,255,.12); right: -60px; top: -90px;
    }
    .band .wrap { position: relative; z-index: 1; display: flex; align-items: center; gap: 14px; }
    .back {
      flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer; color: #fff;
      background: rgba(255,255,255,.22); display: grid; place-items: center; transition: transform .2s var(--ease);
    }
    .back:active { transform: scale(.88); }
    .band h2 { margin: 0; font-size: 24px; letter-spacing: -.01em; animation: fadeUp .5s .1s var(--ease) backwards; }
    .band .sub { font-size: 13px; opacity: .92; animation: textIn .5s .25s var(--ease) backwards; }
    .band-icon .ico { animation: float 3s ease-in-out .8s infinite; }
    .band-icon {
      margin-left: auto; flex: none; width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.2);
      display: grid; place-items: center; animation: pop .55s .2s var(--bounce) backwards;
    }
    .search { display: block; position: relative; margin-top: -27px; animation: fadeUp .5s .15s var(--ease) backwards; }
    .search input {
      width: 100%; padding: 14px 16px 14px 44px; font-size: 16px; color: var(--text); background: var(--card);
      border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); outline: none;
    }
    .search input:focus { border-color: var(--g2); }
    .search .ico { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }

    #list { padding: 16px 0 48px; }
    .doc {
      display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 10px;
      background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
      animation: fadeUp .5s var(--ease) backwards; animation-delay: calc(var(--i) * 45ms + 150ms);
    }
    .no-anim .doc { animation: none; }
    .avatar {
      flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff;
      background: linear-gradient(140deg, var(--g1), var(--g2)); box-shadow: 0 6px 14px -8px var(--g2);
      animation: avatarIn .6s var(--bounce) backwards; animation-delay: calc(var(--i) * 45ms + 300ms);
    }
    .avatar .ico { width: 25px; height: 25px; stroke-width: 1.8; }
    .no-anim .avatar { animation: none; }
    .info { flex: 1; min-width: 0; }
    .name { font-weight: 650; font-size: 16px; overflow-wrap: anywhere; }
    .meta { font-size: 13px; color: var(--muted); }
    .nw { white-space: nowrap; }
    .wa {
      flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 10px 13px; border-radius: 999px;
      text-decoration: none; font-weight: 650; font-size: 14px; background: var(--wa); color: var(--wa-text);
      box-shadow: 0 8px 18px -10px rgba(37,211,102,.9); transition: transform .2s var(--ease);
    }
    .wa:hover { transform: translateY(-2px); }
    .wa:active { transform: scale(.92); }
    .wa .ico { width: 18px; height: 18px; animation: ring 4s ease-in-out infinite; animation-delay: calc(var(--i) * .25s + 1.2s); }
    .wa.off { background: var(--line); color: var(--muted); box-shadow: none; font-weight: 500; }
    @media (max-width: 360px) { .wa span { display: none; } .wa { padding: 11px; } }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .note { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 0 0; }

    .sync { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
    .sync:empty { display: none; }
    .sync::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
    .sync.on::before { background: #22c55e; animation: blink 2.4s ease-in-out infinite; }
    .sync.off::before { background: #f59e0b; }
    .sync.off { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <section id="home">
    <div class="wrap">
      <header class="hero">
        <div class="logo">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            <path class="pulse" pathLength="1" d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>
          </svg>
        </div>
        <h1 id="title">Doctors Directory</h1>
        <span class="title-bar" aria-hidden="true"></span>
        <p aria-label="Choose a department"><span id="typed"></span><span class="caret" id="caret"></span></p>
      </header>
      <div class="grid" id="tiles"></div>
      <footer class="credit">Prepared by <b>Yousif Rozhbayani</b><span class="sync" id="sync"></span></footer>
    </div>
  </section>

  <section id="dept" hidden>
    <div class="band">
      <div class="wrap">
        <button class="back" id="back" type="button" aria-label="Back"></button>
        <div>
          <h2 id="deptName"></h2>
          <div class="sub" id="deptCount"></div>
        </div>
        <div class="band-icon" id="deptIcon"></div>
      </div>
    </div>
    <div class="wrap">
      <label class="search">
        <span id="searchIcon"></span>
        <input type="search" id="q" placeholder="Search name or number…" autocomplete="off">
      </label>
      <div id="list"></div>
    </div>
  </section>

  <script>
    var ICON = {
      steth: '<path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/>',
      scissors: '<circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/>',
      baby: '<path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1"/>',
      users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
      doctor: '<circle cx="12" cy="7" r="3.6"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/><path d="M12 15.6v4M10 17.6h4"/>',
      chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
      back: '<path d="m15 18-6-6 6-6"/>',
      search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'
    };
    function svg(name) { return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + ICON[name] + '</svg>'; }

    // The four main departments, in this order. Others from the Sheet are added after them.
    var FIXED = [
      { key: 'Medicine',  g1: '#4f8df7', g2: '#1f4fd1', icon: 'steth' },
      { key: 'Surgery',   g1: '#f7657d', g2: '#c41a42', icon: 'scissors' },
      { key: 'OB/GYN',    g1: '#d26cf0', g2: '#9019ad', icon: 'baby' },
      { key: 'Community', g1: '#22c39d', g2: '#04775c', icon: 'users' }
    ];
    var OTHER = { g1: '#8794ab', g2: '#475569', icon: 'plus' };

    var $ = function (id) { return document.getElementById(id); };
    var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var startedAt = Date.now();
    var doctors = [], loaded = false, currentKey = null;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function deptKey(dept) {
      var s = dept.toLowerCase();
      if (s.indexOf('community') > -1) return 'Community';
      if (/\bob\b|gyn|obst/.test(s)) return 'OB/GYN';
      if (s.indexOf('surg') > -1) return 'Surgery';
      if (s.indexOf('medic') > -1) return 'Medicine';
      return dept;
    }
    function info(key) {
      for (var i = 0; i < FIXED.length; i++) if (FIXED[i].key === key) return FIXED[i];
      return { key: key, g1: OTHER.g1, g2: OTHER.g2, icon: OTHER.icon };
    }
    function plural(n) { return n === 1 ? 'doctor' : 'doctors'; }

    /* ---------- Home tiles ---------- */
    function tileHTML(d, i) {
      return '<button type="button" class="tile" data-key="' + esc(d.key) + '" style="--g1:' + d.g1 + ';--g2:' + d.g2 + ';--i:' + i + '">' +
        '<span class="tile-icon">' + svg(d.icon) + '</span>' +
        '<span><span class="tile-name">' + esc(d.key) + '</span>' +
        '<span class="tile-count"><b class="num" data-n="0">–</b> <span class="lbl">doctors</span></span></span>' +
      '</button>';
    }
    function countTo(tile, to) {
      var el = tile.querySelector('.num');
      var from = parseInt(el.getAttribute('data-n'), 10) || 0;
      el.setAttribute('data-n', to);
      tile.querySelector('.lbl').textContent = plural(to);
      var token = el._count = {};
      if (reduced || from === to) { el.textContent = to; return; }
      var t0 = null;
      (function step(t) {
        if (el._count !== token) return;   // a newer count started
        if (!t0) t0 = t;
        var p = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(from + (to - from) * e);
        if (p < 1) requestAnimationFrame(step);
      })(performance.now());
    }
    var countTimer;
    function syncTiles() {
      var counts = {};
      doctors.forEach(function (d) { counts[d._key] = (counts[d._key] || 0) + 1; });
      var extras = Object.keys(counts).filter(function (k) { return info(k).g1 === OTHER.g1; }).sort();
      var grid = $('tiles');

      // remove extra tiles that are no longer in the Sheet, add new ones
      Array.prototype.forEach.call(grid.querySelectorAll('.tile'), function (t) {
        var k = t.getAttribute('data-key');
        if (info(k).g1 === OTHER.g1 && extras.indexOf(k) === -1) t.remove();
      });
      extras.forEach(function (k, i) {
        if (!grid.querySelector('.tile[data-key="' + CSS.escape(k) + '"]')) {
          grid.insertAdjacentHTML('beforeend', tileHTML(info(k), FIXED.length + i));
        }
      });

      var wait = Math.max(0, 950 - (Date.now() - startedAt));
      clearTimeout(countTimer);
      countTimer = setTimeout(function () {
        Array.prototype.forEach.call(grid.querySelectorAll('.tile'), function (t) {
          countTo(t, counts[t.getAttribute('data-key')] || 0);
        });
      }, wait);
    }

    /* ---------- Department list ---------- */
    function docHTML(d, i) {
      var meta = d.details.map(esc).join(' · ');
      // dir="ltr" keeps the number in the right order inside Kurdish (right-to-left) cards
      var phone = d.phone ? '<div class="meta"><span class="nw" dir="ltr">' + esc(d.phone) + '</span></div>' : '';
      var wa = d.wa
        ? '<a class="wa" target="_blank" rel="noopener" href="https://wa.me/' + esc(d.wa) + '">' + svg('chat') + '<span>WhatsApp</span></a>'
        : '<span class="wa off">No number</span>';
      // dir="auto": Kurdish/Arabic names show right-to-left, English names left-to-right
      return '<div class="doc" dir="auto" style="--i:' + Math.min(i, 10) + '">' +
        '<div class="avatar">' + svg('doctor') + '</div>' +
        '<div class="info"><div class="name">' + esc(d.name) + '</div>' +
        (meta ? '<div class="meta">' + meta + '</div>' : '') + phone + '</div>' + wa +
      '</div>';
    }
    function renderList(animate) {
      var list = $('list');
      list.classList.toggle('no-anim', !animate);
      if (!loaded) { $('deptCount').textContent = 'Loading…'; list.innerHTML = ''; return; }

      var rows = doctors.filter(function (d) { return d._key === currentKey; });
      $('deptCount').textContent = rows.length + ' ' + plural(rows.length);

      var q = $('q').value.trim().toLowerCase(), qd = q.replace(/\D/g, '');
      var shown = rows.filter(function (d) {
        return !q || d._text.indexOf(q) > -1 || (qd.length >= 3 && d._digits.indexOf(qd) > -1);
      });

      if (!rows.length) list.innerHTML = '<div class="empty">No doctors here yet.</div>';
      else if (!shown.length) list.innerHTML = '<div class="empty">No match.</div>';
      else list.innerHTML = shown.map(docHTML).join('');
    }
    function openDept(key) {
      var d = info(key);
      currentKey = key;
      var sec = $('dept');
      sec.style.setProperty('--g1', d.g1);
      sec.style.setProperty('--g2', d.g2);
      $('deptName').textContent = key;
      $('deptIcon').innerHTML = svg(d.icon);
